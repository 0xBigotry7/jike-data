name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Scheduled collection paused by user on 2026-09-19.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify collector
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify decision tools
        run: |
          node --check dist/app.js
          node --check dist/mobile.js
          node --check dist/decision.js
          node --check dist/workbench.js
          node --check dist/agent-workspace.js
          node --check dist/data-desk.js
          node scripts/test_data_desk.cjs
          node scripts/test_decision.cjs
          node scripts/test_loading.cjs
          node scripts/test_missions.cjs
      - name: Check public sources
        if: ${{ false }} # Collection paused by user
        run: python3 scripts/collect_watch.py
      - name: Save observed source state
        if: ${{ false }} # Collection paused by user
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/watch.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public source observations'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
